<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* COPY EXACT CSS FROM home.html HERE */
  :root { --bg: #0a0e14; --bg-secondary: #111820; --bg-card: #151d28; --bg-elevated: #1a2332; --fg: #e8edf3; --fg-muted: #6b7d94; --fg-dim: #3d4f63; --accent: #00d4aa; --accent-glow: rgba(0, 212, 170, 0.25); --accent-dark: #00a885; --danger: #ff4757; --warning: #ffa502; --success: #2ed573; --border: rgba(255,255,255,0.06); --glass: rgba(17, 24, 32, 0.85); --radius: 14px; --radius-sm: 8px; --radius-full: 9999px; --shadow: 0 8px 32px rgba(0,0,0,0.4); --shadow-accent: 0 4px 20px rgba(0, 212, 170, 0.3); --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; } .app-shell { max-width: 430px; margin: 0 auto; height: 100vh; height: 100dvh; position: relative; overflow: hidden; background: var(--bg); } .bg-atmosphere { position: fixed; top: 0; left: 50%; transform: translateX(-50%); max-width: 430px; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; } .bg-atmosphere .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: orbFloat 12s ease-in-out infinite; } .bg-atmosphere .orb:nth-child(1) { width: 300px; height: 300px; background: var(--accent); top: -80px; right: -60px; } .bg-atmosphere .orb:nth-child(2) { width: 200px; height: 200px; background: #ff6b6b; bottom: 100px; left: -40px; animation-delay: -4s; opacity: 0.08; } .bg-atmosphere .orb:nth-child(3) { width: 250px; height: 250px; background: #ffd93d; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -8s; opacity: 0.05; } @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -30px) scale(1.1); } 66% { transform: translate(-15px, 20px) scale(0.95); } } .page { position: absolute; top: 0; left: 0; right: 0; bottom: 64px; overflow-y: auto; overflow-x: hidden; z-index: 1; opacity: 0; transform: translateY(20px); pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; -webkit-overflow-scrolling: touch; scrollbar-width: none; } .page::-webkit-scrollbar { display: none; } .page.active { opacity: 1; transform: translateY(0); pointer-events: all; } .top-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); } .top-bar .logo { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; } .top-bar .actions { display: flex; gap: 16px; } .top-bar .actions button { background: none; border: none; color: var(--fg); font-size: 20px; cursor: pointer; position: relative; transition: var(--transition); } .top-bar .actions button:hover { color: var(--accent); } .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; z-index: 100; display: flex; align-items: center; justify-content: space-around; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--border); } .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--fg-dim); font-size: 10px; font-family: 'Outfit', sans-serif; font-weight: 500; cursor: pointer; padding: 6px 14px; border-radius: var(--radius-sm); transition: var(--transition); position: relative; text-decoration: none; } .nav-item i { font-size: 20px; transition: var(--transition); } .nav-item.active { color: var(--accent); } .nav-item.active i { transform: scale(1.1); } .nav-item::before { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%) scaleX(0); width: 24px; height: 2px; border-radius: 2px; background: var(--accent); transition: var(--transition); } .nav-item.active::before { transform: translateX(-50%) scaleX(1); } .nav-item.upload-btn { position: relative; top: -10px; } .nav-item.upload-btn .upload-icon-wrap { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-accent); transition: var(--transition); } .nav-item.upload-btn i { color: #fff; font-size: 20px; } .nav-item.upload-btn span { display: none; } .profile-header { padding: 20px 18px; display: flex; align-items: center; gap: 20px; } .profile-pic-wrap { position: relative; flex-shrink: 0; } .profile-pic-wrap img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); } .profile-pic-wrap .online-dot { position: absolute; bottom: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--success); border: 3px solid var(--bg); } .profile-stats { display: flex; gap: 20px; flex: 1; justify-content: center; } .profile-stat { text-align: center; cursor: pointer; } .profile-stat .num { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; } .profile-stat .label { font-size: 11px; color: var(--fg-muted); } .profile-info { padding: 0 18px 16px; } .profile-info .display-name { font-size: 16px; font-weight: 700; } .profile-info .bio { font-size: 13px; color: var(--fg-muted); margin-top: 4px; line-height: 1.5; } .profile-info .profile-link { font-size: 13px; color: var(--accent); margin-top: 4px; } .profile-buttons { display: flex; gap: 8px; padding: 0 18px 16px; } .profile-buttons button { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Outfit', sans-serif; transition: var(--transition); } .btn-edit-profile { background: var(--bg-card); border: 1px solid var(--border); color: var(--fg); } .btn-edit-profile:hover { border-color: var(--accent); } .btn-share-profile { background: var(--bg-card); border: 1px solid var(--border); color: var(--fg); } .btn-share-profile:hover { border-color: var(--accent); } .btn-settings { width: 38px !important; flex: none !important; display: flex; align-items: center; justify-content: center; } .profile-tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); } .profile-tab { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: var(--fg-dim); font-size: 20px; cursor: pointer; transition: var(--transition); position: relative; } .profile-tab.active { color: var(--fg); } .profile-tab::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%) scaleX(0); width: 40px; height: 2px; background: var(--fg); border-radius: 2px; transition: var(--transition); } .profile-tab.active::after { transform: translateX(-50%) scaleX(1); } .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; } .profile-grid-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative; } .profile-grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; } .profile-grid-item:hover img { transform: scale(1.05); } .profile-grid-item .grid-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; gap: 16px; opacity: 0; transition: var(--transition); } .profile-grid-item:hover .grid-overlay { opacity: 1; } .grid-overlay span { color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; } .settings-list { padding: 0 18px 20px; } .settings-group-title { font-size: 12px; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.5px; padding: 16px 0 8px; } .setting-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition); } .setting-item:last-child { border-bottom: none; } .setting-item:hover { opacity: 0.8; } .setting-item i { width: 24px; text-align: center; color: var(--fg-muted); font-size: 16px; } .setting-item .setting-label { flex: 1; font-size: 14px; } .setting-item .setting-value { font-size: 13px; color: var(--fg-muted); } .setting-item .setting-arrow { color: var(--fg-dim); font-size: 12px; } .setting-item.danger { color: var(--danger); } .setting-item.danger i { color: var(--danger); } .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 400px; width: calc(100% - 36px); } .toast { padding: 14px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; animation: toastIn 0.35s ease, toastOut 0.35s ease 2.5s forwards; box-shadow: var(--shadow); } .toast.success { background: #0d2818; border: 1px solid rgba(46, 213, 115, 0.3); color: var(--success); } .toast.error { background: #2d0f13; border: 1px solid rgba(255, 71, 87, 0.3); color: var(--danger); } .toast.info { background: #0d1f2d; border: 1px solid rgba(0, 212, 170, 0.3); color: var(--accent); } @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } } @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } } .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.show { opacity: 1; pointer-events: all; } .modal-sheet { max-width: 430px; width: 100%; background: var(--bg-secondary); border-radius: 20px 20px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); max-height: 70vh; overflow-y: auto; } .modal-overlay.show .modal-sheet { transform: translateY(0); } .modal-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--fg-dim); margin: 0 auto 16px; } .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; } .modal-option { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); } .modal-option:hover { background: var(--bg-elevated); } .modal-option i { font-size: 20px; width: 28px; text-align: center; } .modal-option span { font-size: 14px; font-weight: 500; } .fade-up { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s ease forwards; } @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } } .fade-up:nth-child(2) { animation-delay: 0.05s; } .fade-up:nth-child(3) { animation-delay: 0.1s; } .fade-up:nth-child(4) { animation-delay: 0.15s; } .fade-up:nth-child(5) { animation-delay: 0.2s; } .auth-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; z-index: 200; } .auth-screen .logo-auth { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; } .auth-screen .logo-auth .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent); } .auth-screen input { width: 100%; max-width: 300px; padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); font-size: 15px; font-family: 'Outfit', sans-serif; outline: none; margin-bottom: 16px; transition: var(--transition); } .auth-screen input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); } .auth-screen button { width: 100%; max-width: 300px; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #000; font-size: 15px; font-weight: 700; font-family: 'Outfit', sans-serif; border: none; border-radius: var(--radius); cursor: pointer; transition: var(--transition); } .auth-screen button:hover { box-shadow: var(--shadow-accent); transform: translateY(-1px); } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } } @media (min-width: 431px) { .app-shell { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="bg-atmosphere"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  
  <div class="auth-screen" id="authScreen">
    <div class="logo-auth"><div class="dot"></div>InstaGram</div>
    <input type="text" id="regName" placeholder="Enter your name to continue">
    <button onclick="registerBrowserUser()">Join InstaGram</button>
  </div>

  <div class="page active" id="page-profile" style="display:none">
    <div class="top-bar">
      <div class="logo"><i class="fas fa-lock" style="font-size:14px;color:var(--fg-muted)"></i> <span id="profileUsername">Loading...</span></div>
      <div class="actions"><button aria-label="Menu" id="profileMenuBtn" onclick="toggleSettings()"><i class="fas fa-bars"></i></button></div>
    </div>

    <div class="profile-header fade-up">
      <div class="profile-pic-wrap">
        <img id="profilePic" src="" alt="Profile">
        <div class="online-dot"></div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat"><div class="num" id="profilePostCount">0</div><div class="label">Posts</div></div>
        <div class="profile-stat"><div class="num">0</div><div class="label">Followers</div></div>
        <div class="profile-stat"><div class="num">0</div><div class="label">Following</div></div>
      </div>
    </div>

    <div class="profile-info fade-up">
      <div class="display-name" id="profileDisplayName">Loading...</div>
      <div class="bio">Welcome to my profile!</div>
      <div class="profile-link" id="profilePlatform"></div>
    </div>

    <div class="profile-buttons fade-up">
      <button class="btn-edit-profile" onclick="changeProfilePic()">Change Pic</button>
      <button class="btn-share-profile" onclick="shareProfile()">Share Profile</button>
      <button class="btn-settings btn-edit-profile" onclick="toggleSettings()" aria-label="Settings"><i class="fas fa-cog"></i></button>
    </div>

    <div id="profileContent">
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="grid" aria-label="Posts"><i class="fas fa-th"></i></button>
        <button class="profile-tab" data-tab="reels" aria-label="Reels"><i class="fas fa-play-circle"></i></button>
        <button class="profile-tab" data-tab="tagged" aria-label="Tagged"><i class="fas fa-user-tag"></i></button>
      </div>
      <div class="profile-grid" id="profileGrid"></div>
    </div>

    <div id="settingsContent" style="display:none">
      <div class="settings-list">
        <div class="settings-group-title">Account</div>
        <div class="setting-item" onclick="showToast('Opening account settings...', 'info')"><i class="fas fa-user-circle"></i><span class="setting-label">Account Settings</span><i class="fas fa-chevron-right setting-arrow"></i></div>
        <div class="setting-item" onclick="showToast('Opening security...', 'info')"><i class="fas fa-shield-alt"></i><span class="setting-label">Security</span><i class="fas fa-chevron-right setting-arrow"></i></div>
        <div class="setting-item" onclick="showToast('Opening privacy...', 'info')"><i class="fas fa-lock"></i><span class="setting-label">Privacy</span><i class="fas fa-chevron-right setting-arrow"></i></div>
        <div class="settings-group-title">Preferences</div>
        <div class="setting-item" onclick="showToast('Opening notifications...', 'info')"><i class="fas fa-bell"></i><span class="setting-label">Notifications</span><span class="setting-value">On</span><i class="fas fa-chevron-right setting-arrow"></i></div>
        <div class="setting-item" onclick="showToast('Opening theme...', 'info')"><i class="fas fa-palette"></i><span class="setting-label">Appearance</span><span class="setting-value">Dark</span><i class="fas fa-chevron-right setting-arrow"></i></div>
        <div class="settings-group-title">Session</div>
        <div class="setting-item danger" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i><span class="setting-label">Log Out</span></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation" style="display:none">
    <a href="home.html" class="nav-item" aria-label="Home"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="wallet.html" class="nav-item" aria-label="Wallet"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    <a href="upload.html" class="nav-item upload-btn" aria-label="Upload"><div class="upload-icon-wrap"><i class="fas fa-plus"></i></div><span>Upload</span></a>
    <a href="referral.html" class="nav-item" aria-label="Referral"><i class="fas fa-gift"></i><span>Invite</span></a>
    <a href="profile.html" class="nav-item active" aria-label="Profile"><i class="fas fa-user"></i><span>Profile</span></a>
  </nav>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()"><div class="modal-handle"></div><div id="modalContent"></div></div></div>
  <div class="toast-container" id="toastContainer"></div>
</div>

<script src="app.js"></script>
<script>
function setupPage() {
  document.getElementById('page-profile').style.display = 'block';
  document.querySelector('.bottom-nav').style.display = 'flex';
  loadProfileUI();
  fetchProfilePosts(renderProfileGrid);
}

function loadProfileUI() {
  if (!currentUserData) return;
  document.getElementById('profileUsername').textContent = currentUserData.name;
  document.getElementById('profileDisplayName').textContent = currentUserData.name;
  document.getElementById('profilePic').src = currentUserData.image;
  document.getElementById('profilePlatform').textContent = 'Platform: ' + (currentUserData.platform === 'telegram' ? 'Telegram' : 'Browser');
}

function renderProfileGrid(posts) {
  document.getElementById('profilePostCount').textContent = posts.length;
  const grid = document.getElementById('profileGrid');
  grid.innerHTML = '';
  if (posts.length === 0) {
    grid.innerHTML = '<div style="grid-column: span 3; text-align:center; padding:60px 20px; color:var(--fg-dim)"><i class="fas fa-camera" style="font-size:48px;margin-bottom:16px;display:block"></i>No posts yet.</div>';
    return;
  }
  posts.forEach(post => {
    grid.innerHTML += `
      <div class="profile-grid-item">
        <img src="${post.imageUrl}" alt="Post">
        <div class="grid-overlay">
          <span><i class="fas fa-heart"></i> ${post.likedBy ? Object.keys(post.likedBy).length : 0}</span>
          <span><i class="fas fa-comment"></i> ${post.comments ? Object.keys(post.comments).length : 0}</span>
        </div>
      </div>`;
  });
}

function toggleSettings() {
  const content = document.getElementById('profileContent');
  const settings = document.getElementById('settingsContent');
  if (content.style.display === 'none') {
    content.style.display = 'block';
    settings.style.display = 'none';
  } else {
    content.style.display = 'none';
    settings.style.display = 'block';
  }
}

function changeProfilePic() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      updateProfilePic(ev.target.result);
      showToast('Profile picture updated!', 'success');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function shareProfile() {
  if (navigator.share) {
    navigator.share({ title: 'Check out my profile', url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href);
    showToast('Profile link copied!', 'info');
  }
}

function logoutUser() {
  auth.signOut().then(() => {
    localStorage.removeItem('igram_user');
    showToast('Logged out successfully', 'error');
    setTimeout(() => location.reload(), 1000);
  });
}
</script>
</body>
</html>
