<!DOCTYPE html>
<html lang="en">
<head>

    <title>Loading...</title>

<body class="light-mode">

                            <stop offset="0%" stop-color="#F56040"/>
                            <stop offset="50%" stop-color="#E1306C"/>

                    </defs>
                </svg>
            </div>
            <p class="splash-text">Initializing...</p>
