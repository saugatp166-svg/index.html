<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upload - InstaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{--bg:#0a0e14;--bg2:#111820;--bg-card:#151d28;--bg-el:#1a2332;--fg:#e8edf3;--fg-m:#6b7d94;--fg-d:#3d4f63;--accent:#00d4aa;--accent-glow:rgba(0,212,170,.25);--accent-dk:#00a885;--danger:#ff4757;--warn:#ffa502;--ok:#2ed573;--border:rgba(255,255,255,.06);--glass:rgba(17,24,32,.85);--r:14px;--rs:8px;--rf:9999px;--tr:.3s cubic-bezier(.4,0,.2,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
  .bg-atm{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
  .bg-atm .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1;animation:orbF 12s ease-in-out infinite}
  .bg-atm .orb:nth-child(1){width:250px;height:250px;background:var(--accent);top:-60px;right:-40px}
  .bg-atm .orb:nth-child(2){width:180px;height:180px;background:#ff6b6b;bottom:80px;left:-30px;opacity:.05;animation-delay:-4s}
  @keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-15px,20px) scale(.95)}}
  .page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .page::-webkit-scrollbar{display:none}
  .top-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .top-bar .back-btn{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;transition:var(--tr)}
  .top-bar .back-btn:hover{color:var(--accent)}
  .logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
  .top-actions button{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;transition:var(--tr)}
  .top-actions button:hover{color:var(--accent)}

  /* Type selector */
  .type-sel{display:flex;margin:16px 18px 0;gap:8px}
  .type-btn{flex:1;padding:12px;border-radius:var(--r);background:var(--bg-card);border:2px solid var(--border);color:var(--fg-m);font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:8px}
  .type-btn:hover{border-color:var(--fg-d)}
  .type-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
  .type-btn i{font-size:18px}

  /* Method tabs */
  .method-tabs{display:flex;margin:16px 18px 0;gap:0;background:var(--bg-card);border-radius:var(--rs);padding:3px;border:1px solid var(--border)}
  .method-tab{flex:1;padding:10px;text-align:center;background:none;border:none;color:var(--fg-d);font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;border-radius:6px;transition:var(--tr)}
  .method-tab.active{background:var(--accent);color:#000}

  /* Upload zone */
  .upload-zone{margin:16px 18px;border:2px dashed var(--fg-d);border-radius:var(--r);padding:36px 20px;text-align:center;transition:var(--tr);cursor:pointer;position:relative;overflow:hidden}
  .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--accent-glow)}
  .upload-zone i{font-size:44px;color:var(--fg-d);margin-bottom:10px;display:block;transition:var(--tr)}
  .upload-zone:hover i,.upload-zone.dragover i{color:var(--accent)}
  .upload-zone p{color:var(--fg-m);font-size:14px}
  .upload-zone .sub{font-size:12px;color:var(--fg-d);margin-top:6px}
  .upload-zone input[type="file"]{display:none}

  /* URL input */
  .url-section{margin:16px 18px 0;display:none}
  .url-section.show{display:block}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--fg-m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .form-input{width:100%;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:14px;font-family:'Outfit',sans-serif;outline:none;transition:var(--tr);resize:none}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .form-input::placeholder{color:var(--fg-d)}

  /* Preview */
  .preview-box{margin:16px 18px 0;display:none;border-radius:var(--r);overflow:hidden;position:relative;background:var(--bg-card);border:1px solid var(--border)}
  .preview-box.show{display:block}
  .preview-box img,.preview-box video{width:100%;max-height:320px;object-fit:contain;display:block;background:#000}
  .preview-box .rm-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
  .preview-box .rm-btn:hover{background:var(--danger)}
  .preview-label{padding:8px 12px;font-size:11px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

  /* Thumbnail row for video */
  .thumb-row{margin:12px 18px 0;display:none}
  .thumb-row.show{display:flex;gap:12px;align-items:flex-start}
  .thumb-preview{width:100px;height:100px;border-radius:var(--rs);overflow:hidden;flex-shrink:0;background:var(--bg-card);border:1px solid var(--border)}
  .thumb-preview img{width:100%;height:100%;object-fit:cover}
  .thumb-preview .rm-thumb{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* Filters */
  .filter-row{display:flex;gap:10px;padding:16px 18px 0;overflow-x:auto;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-chip{flex-shrink:0;padding:8px 18px;border-radius:var(--rf);background:var(--bg-card);border:1px solid var(--border);color:var(--fg-m);font-size:13px;font-family:'Outfit',sans-serif;cursor:pointer;transition:var(--tr);font-weight:500}
  .filter-chip:hover{border-color:var(--accent);color:var(--fg)}
  .filter-chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}

  /* Form details */
  .detail-form{padding:16px 18px}
  .char-count{text-align:right;font-size:11px;color:var(--fg-d);margin-top:4px}
  .char-count.warn{color:var(--warn)}
  .char-count.over{color:var(--danger)}

  /* Publish */
  .publish-wrap{padding:0 18px 32px}
  .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dk));color:#000;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;border:none;border-radius:var(--r);cursor:pointer;transition:var(--tr);position:relative;overflow:hidden}
  .btn-primary:hover{box-shadow:0 4px 20px rgba(0,212,170,.3);transform:translateY(-1px)}
  .btn-primary:active{transform:scale(.98)}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

  /* Loading overlay */
  .loading-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .3s ease}
  .loading-ov.show{opacity:1;pointer-events:all}
  .spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-ov p{font-size:15px;color:var(--fg-m)}

  /* Toast */
  .toast-c{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:400px;width:calc(100% - 36px)}
  .toast{padding:14px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:tIn .35s ease,tOut .35s ease 2.5s forwards;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .toast.success{background:#0d2818;border:1px solid rgba(46,213,115,.3);color:var(--ok)}
  .toast.error{background:#2d0f13;border:1px solid rgba(255,71,87,.3);color:var(--danger)}
  .toast.info{background:#0d1f2d;border:1px solid rgba(0,212,170,.3);color:var(--accent)}
  @keyframes tIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes tOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

  .fade-up{opacity:0;transform:translateY(16px);animation:fadeU .5s ease forwards}
  @keyframes fadeU{to{opacity:1;transform:translateY(0)}}
  .fade-up:nth-child(2){animation-delay:.06s}
  .fade-up:nth-child(3){animation-delay:.12s}
  @media(min-width:431px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bg-atm"><div class="orb"></div><div class="orb"></div></div>

  <div class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="goBack()" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
      <div class="logo">New Post</div>
      <div class="top-actions"><button onclick="resetAll()" aria-label="Close"><i class="fas fa-times"></i></button></div>
    </div>

    <!-- Step 1: Select Type -->
    <div class="type-sel fade-up">
      <button class="type-btn active" data-type="image" onclick="selectType('image')">
        <i class="fas fa-image"></i> Image
      </button>
      <button class="type-btn" data-type="video" onclick="selectType('video')">
        <i class="fas fa-video"></i> Video
      </button>
    </div>

    <!-- Step 2: Method (URL or Direct Upload) -->
    <div class="method-tabs fade-up" id="methodTabs">
      <button class="method-tab active" data-method="direct" onclick="selectMethod('direct')">
        <i class="fas fa-upload"></i> Direct Upload
      </button>
      <button class="method-tab" data-method="url" onclick="selectMethod('url')">
        <i class="fas fa-link"></i> From URL
      </button>
    </div>

    <!-- Direct Upload Zone -->
    <div class="upload-zone fade-up" id="uploadZone">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>Tap to select or drag here</p>
      <div class="sub" id="uploadHint">JPG, PNG, WEBP up to 10MB</div>
      <input type="file" id="fileInput" accept="image/*,video/*">
    </div>

    <!-- URL Inputs -->
    <div class="url-section" id="urlSection">
      <div class="form-group" id="mediaUrlGroup">
        <label id="mediaUrlLabel">Image URL</label>
        <input class="form-input" id="mediaUrlInput" type="url" placeholder="https://example.com/photo.jpg">
      </div>
      <!-- Video thumbnail URL (only for video type) -->
      <div class="form-group" id="thumbUrlGroup" style="display:none">
        <label>Thumbnail Image URL</label>
        <input class="form-input" id="thumbUrlInput" type="url" placeholder="https://example.com/thumbnail.jpg">
      </div>
      <button style="padding:10px 24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:var(--tr)" onclick="previewFromUrl()" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <i class="fas fa-eye" style="margin-right:6px"></i>Preview
      </button>
    </div>

    <!-- Video: Thumbnail direct upload (shown only for video + direct method) -->
    <div class="thumb-row" id="thumbUploadRow">
      <div style="flex:1">
        <div class="form-group" style="margin-bottom:8px">
          <label style="font-size:11px;color:var(--fg-m);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px;display:block">Thumbnail Image</label>
          <div style="display:flex;gap:8px">
            <div class="upload-zone" id="thumbZone" style="margin:0;padding:16px;flex:1;border-width:1px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <i class="fas fa-image" style="font-size:24px;margin-bottom:4px"></i>
              <p style="font-size:12px;margin:0">Select thumbnail</p>
              <input type="file" id="thumbFileInput" accept="image/*" style="display:none">
            </div>
          </div>
        </div>
      </div>
      <div class="thumb-preview" id="thumbPreview" style="display:none;position:relative">
        <img id="thumbPreviewImg" src="" alt="Thumb">
      </div>
    </div>

    <!-- Main Preview -->
    <div class="preview-box" id="previewBox">
      <div class="preview-label" id="previewLabel">Preview</div>
      <div id="previewContent"></div>
      <button class="rm-btn" onclick="removeMainPreview()" aria-label="Remove"><i class="fas fa-times"></i></button>
    </div>

    <!-- Filters (image only) -->
    <div class="filter-row" id="filterRow" style="display:none">
      <button class="filter-chip active" data-filter="none">Normal</button>
      <button class="filter-chip" data-filter="grayscale(100%)">B&W</button>
      <button class="filter-chip" data-filter="sepia(80%)">Sepia</button>
      <button class="filter-chip" data-filter="contrast(140%)">Vivid</button>
      <button class="filter-chip" data-filter="saturate(180%)">Saturated</button>
      <button class="filter-chip" data-filter="brightness(110%) contrast(90%)">Soft</button>
      <button class="filter-chip" data-filter="hue-rotate(30deg)">Warm</button>
      <button class="filter-chip" data-filter="hue-rotate(180deg)">Cool</button>
    </div>

    <!-- Details Form -->
    <div class="detail-form" id="detailForm" style="display:none">
      <div class="form-group">
        <label for="captionInput">Caption</label>
        <textarea class="form-input" id="captionInput" rows="3" placeholder="Write a caption..." maxlength="500"></textarea>
        <div class="char-count" id="charCount">0 / 500</div>
      </div>
      <div class="form-group">
        <label for="tagsInput">Tags</label>
        <input class="form-input" id="tagsInput" type="text" placeholder="#photography #nature">
      </div>
      <div class="form-group">
        <label for="locationInput">Location</label>
        <input class="form-input" id="locationInput" type="text" placeholder="Add a location...">
      </div>
    </div>

    <!-- Publish -->
    <div class="publish-wrap" id="publishWrap" style="display:none">
      <button class="btn-primary" id="publishBtn" disabled onclick="publishPost()">
        <i class="fas fa-paper-plane" style="margin-right:8px"></i>Publish Post
      </button>
    </div>
    <div style="height:20px"></div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-ov" id="loadingOv">
    <div class="spinner"></div>
    <p id="loadingText">Publishing your post...</p>
  </div>

  <div class="toast-c" id="toastC"></div>
</div>

<script>
/* ── Firebase Config ── */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const USER_ID = "user_alex_morgan";
const currentUser = { username:'alex_morgan', displayName:'Alex Morgan', avatar:'https://picsum.photos/seed/myprofile/200/200.jpg' };

/* ── State ── */
let uploadType = 'image'; // 'image' | 'video'
let uploadMethod = 'direct'; // 'direct' | 'url'
let mainFile = null;
let mainUrl = '';
let thumbFile = null;
let thumbUrl = '';
let currentFilter = 'none';

/* ── Type Selection ── */
function selectType(type) {
  uploadType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));

  const hint = document.getElementById('uploadHint');
  const fileInput = document.getElementById('fileInput');
  const thumbUploadRow = document.getElementById('thumbUploadRow');
  const thumbUrlGroup = document.getElementById('thumbUrlGroup');
  const mediaUrlLabel = document.getElementById('mediaUrlLabel');
  const filterRow = document.getElementById('filterRow');

  if (type === 'image') {
    hint.textContent = 'JPG, PNG, WEBP up to 10MB';
    fileInput.accept = 'image/*';
    thumbUploadRow.classList.remove('show');
    thumbUploadRow.style.display = 'none';
    thumbUrlGroup.style.display = 'none';
    mediaUrlLabel.textContent = 'Image URL';
    filterRow.style.display = uploadMethod === 'direct' && mainFile ? 'flex' : 'none';
  } else {
    hint.textContent = 'MP4, MOV, WEBM up to 50MB';
    fileInput.accept = 'video/*';
    mediaUrlLabel.textContent = 'Video URL';
    if (uploadMethod === 'direct') {
      thumbUploadRow.style.display = 'flex';
      thumbUploadRow.classList.add('show');
    } else {
      thumbUploadRow.style.display = 'none';
      thumbUploadRow.classList.remove('show');
      thumbUrlGroup.style.display = 'block';
    }
    filterRow.style.display = 'none';
  }
  clearPreviews();
  updatePublish();
}

/* ── Method Selection ── */
function selectMethod(method) {
  uploadMethod = method;
  document.querySelectorAll('.method-tab').forEach(t => t.classList.toggle('active', t.dataset.method === method));

  const zone = document.getElementById('uploadZone');
  const urlSec = document.getElementById('urlSection');

  if (method === 'direct') {
    zone.style.display = 'block';
    urlSec.classList.remove('show');
    if (uploadType === 'video') {
      document.getElementById('thumbUploadRow').style.display = 'flex';
      document.getElementById('thumbUploadRow').classList.add('show');
    }
  } else {
    zone.style.display = 'none';
    urlSec.classList.add('show');
    document.getElementById('thumbUploadRow').style.display = 'none';
    document.getElementById('thumbUploadRow').classList.remove('show');
    if (uploadType === 'video') {
      document.getElementById('thumbUrlGroup').style.display = 'block';
    }
  }
  clearPreviews();
  updatePublish();
}

/* ── Direct Upload: File Selection ── */
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) handleMainFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleMainFile(fileInput.files[0]); });

function handleMainFile(file) {
  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');
  if (!isImage && !isVideo) { showToast('Unsupported file type', 'error'); return; }

  // Auto-switch type if mismatch
  if (isVideo && uploadType !== 'video') selectType('video');
  if (isImage && uploadType !== 'image') selectType('image');

  mainFile = file;
  mainUrl = '';
  const reader = new FileReader();
  reader.onload = e => {
    showMainPreview(e.target.result, isVideo ? 'video' : 'image');
  };
  reader.readAsDataURL(file);
}

/* ── Thumbnail file (video direct) ── */
const thumbZone = document.getElementById('thumbZone');
const thumbFileInput = document.getElementById('thumbFileInput');
thumbZone.addEventListener('click', () => thumbFileInput.click());
thumbFileInput.addEventListener('change', () => {
  if (thumbFileInput.files[0]) {
    thumbFile = thumbFileInput.files[0];
    thumbUrl = '';
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('thumbPreviewImg').src = e.target.result;
      document.getElementById('thumbPreview').style.display = 'block';
    };
    reader.readAsDataURL(thumbFile);
  }
});

/* ── URL Preview ── */
function previewFromUrl() {
  const url = document.getElementById('mediaUrlInput').value.trim();
  if (!url) { showToast('Please enter a URL', 'error'); return; }

  mainUrl = url;
  mainFile = null;

  const mediaType = uploadType === 'video' ? 'video' : 'image';
  showMainPreview(url, mediaType);

  // Handle thumbnail URL for video
  if (uploadType === 'video') {
    const tUrl = document.getElementById('thumbUrlInput').value.trim();
    if (tUrl) {
      thumbUrl = tUrl;
      thumbFile = null;
      document.getElementById('thumbPreviewImg').src = tUrl;
      document.getElementById('thumbPreview').style.display = 'block';
    }
  }
  updatePublish();
}

/* ── Preview Display ── */
function showMainPreview(src, type) {
  const box = document.getElementById('previewBox');
  const content = document.getElementById('previewContent');
  const label = document.getElementById('previewLabel');

  label.textContent = type === 'video' ? 'Video Preview' : 'Image Preview';

  if (type === 'video') {
    content.innerHTML = `<video src="${src}" controls style="width:100%;max-height:320px;background:#000;display:block"></video>`;
  } else {
    content.innerHTML = `<img src="${src}" alt="Preview" id="previewImg" style="width:100%;max-height:320px;object-fit:contain;display:block;background:#000">`;
  }

  box.classList.add('show');
  document.getElementById('detailForm').style.display = 'block';
  document.getElementById('publishWrap').style.display = 'block';

  if (type === 'image') {
    document.getElementById('filterRow').style.display = 'flex';
  }

  updatePublish();
}

function removeMainPreview() {
  document.getElementById('previewBox').classList.remove('show');
  document.getElementById('detailForm').style.display = 'none';
  document.getElementById('publishWrap').style.display = 'none';
  document.getElementById('filterRow').style.display = 'none';
  mainFile = null;
  mainUrl = '';
  fileInput.value = '';
  document.getElementById('mediaUrlInput').value = '';
  updatePublish();
}

function clearPreviews() {
  document.getElementById('previewBox').classList.remove('show');
  document.getElementById('detailForm').style.display = 'none';
  document.getElementById('publishWrap').style.display = 'none';
  document.getElementById('filterRow').style.display = 'none';
  document.getElementById('thumbPreview').style.display = 'none';
  mainFile = null; mainUrl = '';
  thumbFile = null; thumbUrl = '';
  fileInput.value = '';
  thumbFileInput.value = '';
  document.getElementById('mediaUrlInput').value = '';
  document.getElementById('thumbUrlInput').value = '';
  document.getElementById('captionInput').value = '';
  document.getElementById('charCount').textContent = '0 / 500';
  document.getElementById('charCount').className = 'char-count';
  currentFilter = 'none';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.filter-chip[data-filter="none"]').classList.add('active');
}

/* ── Filters ── */
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    const img = document.getElementById('previewImg');
    if (img) img.style.filter = currentFilter === 'none' ? '' : currentFilter;
  });
});

/* ── Caption ── */
document.getElementById('captionInput').addEventListener('input', function() {
  const len = this.value.length;
  const cc = document.getElementById('charCount');
  cc.textContent = `${len} / 500`;
  cc.className = 'char-count';
  if (len > 450) cc.classList.add('warn');
  if (len >= 500) cc.classList.add('over');
});

/* ── Publish Button State ── */
function updatePublish() {
  const hasMedia = mainFile || mainUrl;
  const hasThumb = uploadType === 'image' || thumbFile || thumbUrl;
  document.getElementById('publishBtn').disabled = !(hasMedia && hasThumb);
}

/* ── Publish ── */
async function publishPost() {
  const hasMedia = mainFile || mainUrl;
  const hasThumb = uploadType === 'image' || thumbFile || thumbUrl;
  if (!hasMedia || !hasThumb) return;

  const loadingOv = document.getElementById('loadingOv');
  const loadingText = document.getElementById('loadingText');
  loadingOv.classList.add('show');

  // Determine final URLs
  let finalMediaUrl = mainUrl;
  let finalThumbUrl = thumbUrl;

  // For direct file uploads, we store as base64 data URL in Firebase
  // (In production, you'd upload to Firebase Storage instead)
  if (mainFile && !mainUrl) {
    loadingText.textContent = 'Uploading media...';
    finalMediaUrl = await readFileAsDataURL(mainFile);
  }
  if (uploadType === 'video' && thumbFile && !thumbUrl) {
    loadingText.textContent = 'Uploading thumbnail...';
    finalThumbUrl = await readFileAsDataURL(thumbFile);
  }
  if (uploadType === 'image') {
    finalThumbUrl = '';
  }

  loadingText.textContent = 'Publishing...';

  const postId = 'post_' + Date.now();
  const postData = {
    id: postId,
    username: currentUser.username,
    avatar: currentUser.avatar,
    location: document.getElementById('locationInput').value.trim() || '',
    mediaType: uploadType,
    mediaUrl: finalMediaUrl,
    thumbnailUrl: finalThumbUrl,
    caption: document.getElementById('captionInput').value.trim() || '',
    tags: document.getElementById('tagsInput').value.trim() || '',
    filter: uploadType === 'image' ? currentFilter : 'none',
    likes: 0,
    comments: [],
    time: 'now',
    timestamp: Date.now(),
    userId: USER_ID
  };

  try {
    await db.ref('posts/' + postId).set(postData);
    loadingOv.classList.remove('show');
    showToast('Post published successfully!', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);
  } catch (err) {
    loadingOv.classList.remove('show');
    showToast('Failed to publish: ' + err.message, 'error');
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ── Navigation ── */
function goBack() { window.location.href = 'index.html'; }
function resetAll() { clearPreviews(); goBack(); }

/* ── Toast ── */
function showToast(msg, type = 'info') {
  const c = document.getElementById('toastC'), t = document.createElement('div');
  t.className = 'toast ' + type;
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i> ${msg}`;
  c.appendChild(t); setTimeout(() => t.remove(), 3000);
}
</script>
</body>
