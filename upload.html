<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upload</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/upload.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <header class="top-bar">
        <div class="top-bar-left">
            <button class="icon-btn" id="back-btn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
        </div>
        <h1 class="app-title">New Post</h1>
        <div class="top-bar-right">
            <button class="btn-share-post" id="btn-share-post" disabled>Share</button>
        </div>
    </header>

    <main class="upload-container">
        <!-- 上传类型选择 -->
        <div class="upload-type-tabs">
            <button class="upload-tab active" data-type="image">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Image
            </button>
            <button class="upload-tab" data-type="video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                Video
            </button>
        </div>

        <!-- 上传区域 -->
        <div class="upload-dropzone" id="upload-dropzone">
            <div class="dropzone-content" id="dropzone-content">
                <div class="dropzone-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <p class="dropzone-text">Drag and drop or tap to upload</p>
                <p class="dropzone-subtext">JPG, PNG, GIF, MP4, MOV</p>
                <input type="file" id="file-input" accept="image/*,video/*" hidden>
            </div>
            <div class="preview-container" id="preview-container" style="display:none;">
                <img id="image-preview" src="" alt="Preview" style="display:none;">
                <video id="video-preview" src="" controls style="display:none;"></video>
                <button class="preview-remove" id="preview-remove" aria-label="Remove">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <div class="upload-progress-bar" id="upload-progress-bar" style="display:none;">
                    <div class="upload-progress-fill" id="upload-progress-fill"></div>
                </div>
                <span class="upload-progress-text" id="upload-progress-text" style="display:none;">0%</span>
            </div>
        </div>

        <!-- URL输入 -->
        <div class="url-input-section">
            <div class="url-input-toggle" id="url-input-toggle">
                <span>Or paste a URL</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="url-toggle-arrow"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="url-input-fields" id="url-input-fields" style="display:none;">
                <input type="url" id="media-url" class="input-field" placeholder="Image or Video URL">
                <input type="url" id="thumbnail-url" class="input-field" placeholder="Thumbnail Image URL (for videos)" style="display:none;">
                <button class="btn-secondary" id="btn-load-url">Load Preview</button>
            </div>
        </div>

        <!-- 表单字段 -->
        <div class="upload-form">
            <div class="form-group">
                <label for="caption-input">Caption</label>
                <textarea id="caption-input" class="input-field textarea-field" placeholder="Write a caption..." maxlength="2200" rows="4"></textarea>
                <span class="char-count" id="caption-count">0 / 2200</span>
            </div>
            <div class="form-group">
                <label for="hashtags-input">Hashtags</label>
                <input type="text" id="hashtags-input" class="input-field" placeholder="tag1, tag2, tag3...">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="visibility-select">Visibility</label>
                    <select id="visibility-select" class="input-field select-field">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comments</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="comments-toggle" checked>
                        <label for="comments-toggle" class="toggle-label"></label>
                        <span class="toggle-text" id="comments-text">On</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16" stroke="white" stroke-width="2"/><line x1="8" y1="12" x2="16" y2="12" stroke="white" stroke-width="2"/></svg>
            <span>Upload</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="18" cy="15" r="1"/></svg>
            <span>Wallet</span>
        </a>
        <a href="referral.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Refer</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
