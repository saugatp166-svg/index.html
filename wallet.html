<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wallet - InstaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{--bg:#0a0e14;--bg2:#111820;--bg-card:#151d28;--bg-el:#1a2332;--fg:#e8edf3;--fg-m:#6b7d94;--fg-d:#3d4f63;--accent:#00d4aa;--accent-glow:rgba(0,212,170,.25);--accent-dk:#00a885;--danger:#ff4757;--warn:#ffa502;--ok:#2ed573;--border:rgba(255,255,255,.06);--glass:rgba(17,24,32,.85);--r:14px;--rs:8px;--rf:9999px;--tr:.3s cubic-bezier(.4,0,.2,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
  .bg-atm{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
  .bg-atm .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1;animation:orbF 12s ease-in-out infinite}
  .bg-atm .orb:nth-child(1){width:250px;height:250px;background:var(--accent);top:-60px;right:-40px}
  .bg-atm .orb:nth-child(2){width:180px;height:180px;background:#ffd93d;bottom:80px;left:-30px;opacity:.04;animation-delay:-4s}
  @keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-15px,20px) scale(.95)}}
  .page{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .page::-webkit-scrollbar{display:none}
  .top-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .back-btn{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;transition:var(--tr)}
  .back-btn:hover{color:var(--accent)}
  .logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
  .top-actions button{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;transition:var(--tr)}
  .top-actions button:hover{color:var(--accent)}

  .wallet-hero{margin:16px 18px;padding:28px 22px;border-radius:var(--r);background:linear-gradient(135deg,#0d2d24,#0a1f1a,#071510);border:1px solid rgba(0,212,170,.15);position:relative;overflow:hidden}
  .wallet-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.06;filter:blur(40px)}
  .wallet-hero .label{font-size:12px;color:var(--fg-m);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .wallet-hero .balance{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;color:#fff;margin-bottom:4px}
  .wallet-hero .balance .cur{font-size:22px;color:var(--accent)}
  .wallet-hero .change{font-size:13px;color:var(--ok);display:flex;align-items:center;gap:4px}
  .wallet-hero .change.neg{color:var(--danger)}

  .wallet-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px;margin-bottom:24px}
  .wa-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:var(--tr);color:var(--fg);font-family:'Outfit',sans-serif}
  .wa-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .wa-btn:active{transform:scale(.96)}
  .wa-btn .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
  .wa-btn span{font-size:11px;font-weight:500;color:var(--fg-m)}

  .sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:14px}
  .sec-hdr h3{font-size:16px;font-weight:700}
  .sec-hdr .see-all{font-size:13px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:'Outfit',sans-serif;font-weight:500}

  .tx-list{padding:0 18px}
  .tx-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .tx-item:last-child{border-bottom:none}
  .tx-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .tx-info{flex:1;min-width:0}
  .tx-info .tx-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx-info .tx-date{font-size:11px;color:var(--fg-d);margin-top:2px}
  .tx-amount{font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
  .tx-amount.pos{color:var(--ok)}
  .tx-amount.neg{color:var(--danger)}

  /* Deposit / Withdraw modal */
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
  .modal-ov.show{opacity:1;pointer-events:all}
  .modal-sh{max-width:430px;width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);max-height:80vh;overflow-y:auto}
  .modal-ov.show .modal-sh{transform:translateY(0)}
  .modal-handle{width:40px;height:4px;border-radius:4px;background:var(--fg-d);margin:0 auto 16px}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--fg-m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .form-input{width:100%;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:14px;font-family:'Outfit',sans-serif;outline:none;transition:var(--tr)}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .form-input::placeholder{color:var(--fg-d)}
  .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dk));color:#000;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;border:none;border-radius:var(--r);cursor:pointer;transition:var(--tr)}
  .btn-primary:hover{box-shadow:0 4px 20px rgba(0,212,170,.3);transform:translateY(-1px)}
  .btn-primary:active{transform:scale(.98)}

  .quick-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .qa-btn{padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);color:var(--fg);font-size:13px;font-weight:600;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:var(--tr);text-align:center}
  .qa-btn:hover{border-color:var(--accent);color:var(--accent)}
  .qa-btn.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

  .toast-c{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:400px;width:calc(100% - 36px)}
  .toast{padding:14px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:tIn .35s ease,tOut .35s ease 2.5s forwards;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .toast.success{background:#0d2818;border:1px solid rgba(46,213,115,.3);color:var(--ok)}
  .toast.error{background:#2d0f13;border:1px solid rgba(255,71,87,.3);color:var(--danger)}
  .toast.info{background:#0d1f2d;border:1px solid rgba(0,212,170,.3);color:var(--accent)}
  @keyframes tIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes tOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

  .fade-up{opacity:0;transform:translateY(16px);animation:fadeU .5s ease forwards}
  @keyframes fadeU{to{opacity:1;transform:translateY(0)}}
  .fade-up:nth-child(2){animation-delay:.06s}
  .fade-up:nth-child(3){animation-delay:.12s}
  .fade-up:nth-child(4){animation-delay:.18s}

  .empty-state{text-align:center;padding:48px 20px;color:var(--fg-d)}
  .empty-state i{font-size:44px;opacity:.15;margin-bottom:10px;display:block}

  @media(min-width:431px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bg-atm"><div class="orb"></div><div class="orb"></div></div>
  <div class="page">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
      <div class="logo">Wallet</div>
      <div class="top-actions"><button onclick="showToast('Full history loaded','info')" aria-label="History"><i class="fas fa-history"></i></button></div>
    </div>

    <div class="wallet-hero fade-up" id="walletHero">
      <div class="label">Total Balance</div>
      <div class="balance"><span class="cur">$</span><span id="balanceDisplay">0</span></div>
      <div class="change" id="changeDisplay"><i class="fas fa-arrow-up"></i> Loading...</div>
    </div>

    <div class="wallet-actions fade-up">
      <button class="wa-btn" onclick="openDepositModal()">
        <div class="ic" style="background:rgba(0,212,170,.15);color:var(--accent)"><i class="fas fa-plus"></i></div>
        <span>Deposit</span>
      </button>
      <button class="wa-btn" onclick="openWithdrawModal()">
        <div class="ic" style="background:rgba(255,165,2,.15);color:var(--warn)"><i class="fas fa-arrow-up"></i></div>
        <span>Withdraw</span>
      </button>
      <button class="wa-btn" onclick="showToast('Transfer ready','info')">
        <div class="ic" style="background:rgba(116,125,255,.15);color:#747dff"><i class="fas fa-exchange-alt"></i></div>
        <span>Transfer</span>
      </button>
      <button class="wa-btn" onclick="showToast('QR Code generated','success')">
        <div class="ic" style="background:rgba(255,107,107,.15);color:#ff6b6b"><i class="fas fa-qrcode"></i></div>
        <span>QR Pay</span>
      </button>
    </div>

    <div class="sec-hdr fade-up"><h3>Recent Transactions</h3><button class="see-all" onclick="showToast('Showing all transactions','info')">See All</button></div>
    <div class="tx-list fade-up" id="txList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading transactions...</p></div></div>
    <div style="height:24px"></div>
  </div>

  <div class="modal-ov" id="modalOv" onclick="closeModal(event)">
    <div class="modal-sh" id="modalSh" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast-c" id="toastC"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const USER_ID = "user_alex_morgan";

const defaultTx = [
  {title:'Referral Bonus - jake_photo',date:'Today, 2:34 PM',amount:20,type:'income',icon:'fa-gift',color:'var(--ok)'},
  {title:'Post Earnings - Tokyo Nights',date:'Today, 11:20 AM',amount:45.80,type:'income',icon:'fa-image',color:'var(--accent)'},
  {title:'Withdrawal to Bank',date:'Yesterday, 6:15 PM',amount:-500,type:'expense',icon:'fa-university',color:'var(--danger)'},
  {title:'Referral Bonus - nomad_ella',date:'Yesterday, 10:00 AM',amount:35,type:'income',icon:'fa-gift',color:'var(--ok)'},
  {title:'Premium Subscription',date:'Dec 18, 9:00 AM',amount:-9.99,type:'expense',icon:'fa-crown',color:'var(--warn)'},
  {title:'Post Earnings - Golden Hour',date:'Dec 17, 3:45 PM',amount:32.50,type:'income',icon:'fa-image',color:'var(--accent)'},
  {title:'Tip Received - sarah_lens',date:'Dec 16, 8:30 PM',amount:5,type:'income',icon:'fa-heart',color:'#ff6b6b'},
  {title:'Referral Bonus - chef_mike',date:'Dec 15, 1:00 PM',amount:10,type:'income',icon:'fa-gift',color:'var(--ok)'},
];

function loadWallet() {
  const balRef = db.ref('wallet/' + USER_ID + '/balance');
  const txRef = db.ref('wallet/' + USER_ID + '/transactions');

  balRef.once('value').then(snap => {
    const bal = snap.val();
    if (bal !== null) {
      animateBalance(bal);
    } else {
      // Initialize with defaults
      const defaultBal = 2847.50;
      balRef.set(defaultBal);
      animateBalance(defaultBal);
      // Seed default transactions
      txRef.set(defaultTx);
    }
  }).catch(() => {
    // Firebase not configured, use defaults
    animateBalance(2847.50);
    renderTxList(defaultTx);
  });

  txRef.on('value', snap => {
    const data = snap.val();
    if (data) {
      const list = Array.isArray(data) ? data : Object.values(data);
      renderTxList(list);
    } else {
      renderTxList(defaultTx);
    }
  });
}

function animateBalance(target) {
  const el = document.getElementById('balanceDisplay');
  let current = 0;
  const step = Math.max(1, Math.ceil(target / 40));
  const interval = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(interval); }
    el.textContent = current.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }, 30);

  // Calculate change
  const totalIncome = defaultTx.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const pct = ((totalIncome / target) * 100).toFixed(1);
  const changeEl = document.getElementById('changeDisplay');
  changeEl.innerHTML = `<i class="fas fa-arrow-up"></i> +${pct}% this month`;
  changeEl.className = 'change';
}

function renderTxList(txs) {
  const list = document.getElementById('txList');
  if (!txs || !txs.length) {
    list.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions yet</p></div>';
    return;
  }
  list.innerHTML = txs.map(tx => `
    <div class="tx-item">
      <div class="tx-icon" style="background:${tx.color}22;color:${tx.color}"><i class="fas ${tx.icon}"></i></div>
      <div class="tx-info"><div class="tx-title">${tx.title}</div><div class="tx-date">${tx.date}</div></div>
      <div class="tx-amount ${tx.amount>=0?'pos':'neg'}">${tx.amount>=0?'+':''}$${Math.abs(tx.amount).toFixed(2)}</div>
    </div>`).join('');
}

/* ── Deposit Modal ── */
function openDepositModal() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">Deposit Funds</div>
    <div class="quick-amounts">
      <button class="qa-btn" onclick="setAmount(50)">$50</button>
      <button class="qa-btn" onclick="setAmount(100)">$100</button>
      <button class="qa-btn" onclick="setAmount(250)">$250</button>
      <button class="qa-btn" onclick="setAmount(500)">$500</button>
      <button class="qa-btn" onclick="setAmount(1000)">$1,000</button>
      <button class="qa-btn" onclick="setAmount(0)">Custom</button>
    </div>
    <div class="form-group">
      <label>Amount ($)</label>
      <input class="form-input" id="depositAmount" type="number" min="1" step="0.01" placeholder="Enter amount">
    </div>
    <button class="btn-primary" onclick="processDeposit()">Deposit Now</button>
  `;
  openModal();
}

function setAmount(val) {
  document.querySelectorAll('.qa-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const inp = document.getElementById('depositAmount');
  if (val === 0) { inp.value = ''; inp.focus(); }
  else { inp.value = val; }
}

async function processDeposit() {
  const amount = parseFloat(document.getElementById('depositAmount').value);
  if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }

  const balRef = db.ref('wallet/' + USER_ID + '/balance');
  const txRef = db.ref('wallet/' + USER_ID + '/transactions');

  try {
    const snap = await balRef.once('value');
    const currentBal = snap.val() || 0;
    const newBal = currentBal + amount;
    await balRef.set(newBal);

    const newTx = {
      title: 'Deposit',
      date: new Date().toLocaleString('en-US', {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),
      amount: amount,
      type: 'income',
      icon: 'fa-plus-circle',
      color: 'var(--ok)'
    };
    txRef.push(newTx);

    animateBalance(newBal);
    closeModal({target: document.getElementById('modalOv')});
    showToast(`$${amount.toFixed(2)} deposited successfully!`, 'success');
  } catch(err) {
    showToast('Deposit failed: ' + err.message, 'error');
  }
}

/* ── Withdraw Modal ── */
function openWithdrawModal() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">Withdraw Funds</div>
    <div class="form-group">
      <label>Amount ($)</label>
      <input class="form-input" id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Enter amount">
    </div>
    <div class="form-group">
      <label>Bank Account</label>
      <input class="form-input" type="text" value="**** **** **** 4829" readonly style="color:var(--fg-m)">
    </div>
    <button class="btn-primary" onclick="processWithdraw()" style="background:linear-gradient(135deg,var(--warn),#e68a00)">Withdraw Now</button>
  `;
  openModal();
}

async function processWithdraw() {
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }

  const balRef = db.ref('wallet/' + USER_ID + '/balance');
  const txRef = db.ref('wallet/' + USER_ID + '/transactions');

  try {
    const snap = await balRef.once('value');
    const currentBal = snap.val() || 0;
    if (amount > currentBal) { showToast('Insufficient balance', 'error'); return; }

    const newBal = currentBal - amount;
    await balRef.set(newBal);

    const newTx = {
      title: 'Withdrawal to Bank',
      date: new Date().toLocaleString('en-US', {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),
      amount: -amount,
      type: 'expense',
      icon: 'fa-university',
      color: 'var(--danger)'
    };
    txRef.push(newTx);

    animateBalance(newBal);
    closeModal({target: document.getElementById('modalOv')});
    showToast(`$${amount.toFixed(2)} withdrawal initiated`, 'success');
  } catch(err) {
    showToast('Withdrawal failed: ' + err.message, 'error');
  }
}

/* ── Modal ── */
function openModal(){document.getElementById('modalOv').classList.add('show');}
function closeModal(e){if(e&&e.target!==document.getElementById('modalOv'))return;document.getElementById('modalOv').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal({target:document.getElementById('modalOv')});});

/* ── Toast ── */
function showToast(msg,type='info'){
  const c=document.getElementById('toastC'),t=document.createElement('div');
  t.className='toast '+type;
  const icons={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle'};
  t.innerHTML=`<i class="fas ${icons[type]||icons.info}"></i> ${msg}`;
  c.appendChild(t);setTimeout(()=>t.remove(),3000);
}

loadWallet();
</script>
</body>
</html>
