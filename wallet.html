<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wallet - InstaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.js">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--bg2:#111820;--bgc:#151d28;--bge:#1a2332;--fg:#e8edf3;--fm:#6b7d94;--fd:#3d4f63;--ac:#00d4aa;--dn:#ff4757;--ok:#2ed573;--bd:rgba(255,255,255,.06);--gl:rgba(17,24,32,.88);--r:14px;--rs:8px;--rf:9999px;--t:.3s cubic-bezier(.4,0,.2,1)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.atm{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.atm .o{position:absolute;border-radius:50%;filter:blur(80px);animation:of 12s ease-in-out infinite}
.atm .o:nth-child(1){width:180px;height:180px;background:var(--ac);top:-50px;right:-30px;opacity:.07;animation-delay:-4s}
@keyframes of{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-15px,20px) scale(.95)}}
.pg{position:absolute;top:0;left:0;right:0;bottom:60px;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.tb{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.bb{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;padding:4px 8px 4px 0;transition:var(--t)}.bb:hover{color:var(--ac)}
.lg{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.wh{margin:14px 16px;padding:24px 18px;border-radius:var(--r);background:linear-gradient(135deg,#0d2d24,#0a1f1a,#071510);border:1px solid rgba(0,212,170,.15);position:relative;overflow:hidden}
.wh::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:var(--ac);opacity:.06;filter:blur(40px)}
.wh .wl{font-size:11px;color:var(--fm);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.wh .wb{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;color:#fff;margin-bottom:3px}
.wh .wc{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:4px}
.wa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px;margin-bottom:20px}
.wb2{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:var(--bgc);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:var(--t);color:var(--fg);font-family:'Outfit',sans-serif}
.wb2:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wb2 .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.wb2 span{font-size:10px;font-weight:500;color:var(--fm)}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:12px}
.shdr h3{font-size:15px;font-weight:700}
.tl{padding:0 16px}
.ti{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ti:last-child{border-bottom:none}
.tx{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tf{flex:1;min-width:0}
.tf .tt2{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf .td{font-size:10px;color:var(--fd);margin-top:2px}
.ta2{font-size:13px;font-weight:700;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
.ta2.po{color:var(--ok)}.ta2.ne{color:var(--dn)}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 18px;color:var(--fd)}
.es i{font-size:40px;opacity:.15;margin-bottom:8px}
.bn{position:absolute;bottom:0;left:0;right:0;height:60px;z-index:100;display:flex;align-items:center;justify-content:space-around;background:var(--gl);backdrop-filter:blur(24px);border-top:1px solid var(--bd)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--fd);font-size:9px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;padding:4px 12px;border-radius:var(--rs);transition:var(--t);position:relative;text-decoration:none}
.ni i{font-size:19px;transition:var(--t)}.ni.on{color:var(--ac)}.ni.on i{transform:scale(1.1)}
.ni::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%) scaleX(0);width:22px;height:2px;border-radius:2px;background:var(--ac);transition:var(--t)}
.ni.on::before{transform:translateX(-50%) scaleX(1)}
.ni.ub{position:relative;top:-8px}
.ni.ub .uw{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#00a885);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,212,170,.3);transition:var(--t)}
.ni.ub i{color:#fff;font-size:18px}.ni.ub span{display:none}
.tc{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;max-width:390px;width:calc(100% - 32px)}
.to{padding:12px 16px;border-radius:var(--rs);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:6px;animation:ti .3s ease,to2 .3s ease 2.5s forwards;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.to.su{background:#0d2818;border:1px solid rgba(46,213,115,.3);color:var(--ok)}
.to.er{background:#2d0f13;border:1px solid rgba(255,71,87,.3);color:var(--dn)}
.to.in{background:#0d1f2d;border:1px solid rgba(0,212,170,.3);color:var(--ac)}
@keyframes ti{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes to2{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
@media(min-width:431px){.app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<div class="atm"><div class="o"></div></div></div>
<div class="pg">
<div class="tb"><button class="bb" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button><div class="lg">Wallet</div></div>
<div class="wh">
  <div class="wl">Total Balance</div>
  <div class="wb"><span class="cr">$</span><span id="balDsp">0.00</span></div>
  <div class="wc"><i class="fas fa-arrow-up"></i> Your earnings</div>
</div>
<div class="wa">
  <button class="wb2" onclick="openDep()"><div class="ic" style="background:rgba(0,212,170,.15);color:var(--ac)"><i class="fas fa-plus"></i></div><span>Deposit</span></button>
  <button class="wb2" onclick="openWdr()"><div class="ic" style="background:rgba(255,165,2,.15);color:var(--ffa502)"><i class="fas fa-arrow-up"></i></div><span>Withdraw</span></button>
  <button class="wb2" onclick="toast('Transfer coming soon','in')"><div class="ic" style="background:rgba(116,125,255,.15);color:#747dff"><i class="fas fa-exchange-alt"></i></div><span>Transfer</span></button>
  <button class="wb2" onclick="toast('QR coming soon','in')"><div class="ic" style="background:rgba(255,107,107,.15);color:#ff6b6b"><i class="fas fa-qrcode"></i></div><span>QR Pay</span></button>
</div>
<div class="shdr"><h3>Recent Transactions</h3></div>
<div class="tl" id="txList"><div class="es"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></div>
<div style="height:20px"></div>
</div>
<nav class="bn" role="navigation">
<a class="ni" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
<a class="ni" href="wallet.html"><i class="fas fa-wallet"></i><span>Wallet</span></a>
<a class="ni ub" href="upload.html"><div class="uw"><i class="fas fa-plus"></i></div><span>Upload</span></a>
<a class="ni" href="referral.html"><i class="fas fa-gift"></i><span>Invite</span></a>
<a class="ni" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>
<div class="mov" id="mOv" onclick="clMod(event)"><div class="msh" id="mSh" onclick="event.stopPropagation()"><div class="mhd"></div><div id="mCtn"></div></div></div></div>
<div class="tc" id="tCtn"></div>
</div>
<script>
firebase.initializeApp({apiKey:"AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",authDomain:"aibmodel.firebaseapp.com",databaseURL:"https://aibmodel-default-rtdb.firebaseio.com",projectId:"aibmodel",storageBucket:"aibmodel.firebasestorage.app",messagingSenderId:"572663832515",appId:"1:572663832515:web:3fea2dac685b9b5f646776"});
const db=firebase.database(),$=id=>document.getElementById(id);
function toast(m,t='in'){const c=$('tCtn'),e=document.createElement('div');e.className='to '+t;e.innerHTML='<i class="fas fa-info-circle"></i> '+m;c.appendChild(e);setTimeout(()=>e.remove(),3000)}
function opMod(){$('mOv').classList.add('sh')}
function clMod(e){if(e&&e.target!==$('mOv'))return;$('mOv').classList.remove('sh')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')clMod({target:$('mOv')})});
function timeAgo(ts){if(!ts)return'';const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);if(m<1)return'now';if(m<60)return m+'m';if(h<24)return h+'h';if(dy<7)return dy+'d';return new Date(ts).toLocaleDateString()}

let UID='';
function initUser(){
  let sid=null;try{sid=localStorage.getItem('igram_uid')}catch(e){}
  if(sid){UID=sid;db.ref('users/'+UID).once('value').then(s=>{if(s.exists())loadWallet();else createNew()}).catch(()=>createNew())}else createNew()
}
function createNew(){
  UID='u_'+Date.now()+'_'+Math.random().toString(36).substr(2,9);
  const un='user_'+Math.random().toString(36).substr(2,6);
  db.ref('users/'+UID).set({username:un,displayName:'New User',avatar:'',createdAt:Date.now(),lastSeen:Date.now()});
  db.ref('stats/totalUsers').transaction(v=>(v||0)+1);
  db.ref('wallet/'+UID+'/balance').set(15);
  db.ref('wallet/'+UID+'/transactions').push({title:'Welcome Bonus',amount:15,type:'income',icon:'fa-gift',color:'var(--ok)',timestamp:Date.now()});
  try{localStorage.setItem('igram_uid',UID)}catch(e){}
  loadWallet();
}
function loadWallet(){
  db.ref('wallet/'+UID+'/balance').on('value',snap=>{
    const b=snap.val()||0;
    $('balDsp').textContent=b.toFixed(2).replace(/\B(?=(\d{3})+(?!\d)/g,',',',');
  });
  db.ref('wallet/'+UID+'/transactions').on('value',snap=>{
    const d=snap.val();
    if(!d){$('txList').innerHTML='<div class="es"><i class="fas fa-receipt"></i><p>No transactions</p></div>';return}
    const arr=Object.values(d).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    $('txList').innerHTML=arr.map(t=>{
      return '<div class="ti"><div class="tx" style="background:'+(t.color||'var(--ac)')+'22;color:'+(t.color||'var(--ac)+'"><i class="fas '+(t.icon||'fa-circle')+'"></i></div><div class="tf"><div class="tt2">'+(t.title||'Transaction')+'</div><div class="td">'+timeAgo(t.timestamp)+'</div></div><div class="ta2 '+(t.amount>=0?'po':'ne')+'">'+(t.amount>=0?'+':'')+'$'+Math.abs(t.amount).toFixed(2)+'</div></div>';
    }).join('');
  });
}
function openDep(){
  $('mCtn').innerHTML=
    '<div class="mtl">Deposit Funds</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr;gap:7px;margin-bottom:14px">'+
    [10,25,50,100,250,500,1000].map(a=>
      '<button style="padding:9px;background:var(--bgc);border:1px solid var(--bd);border-radius:var(--rs);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:Space Grotesk,sans-serif;transition:var(--t)" onclick="$(\'depAmt\').value='+a+'">$'+a+'</button>'
    ).join('')+
    '</div>'+
    '<div class="fg"><label>Amount ($)</label>'+
    '<input class="fi" id="depAmt" type="number" min="1" step="0.01" placeholder="Enter amount">'+
    '</div>'+
    '<button class="bp" onclick="procDep()">Deposit Now</button>';
  opMod();
}
async function procDep(){
  const a=parseFloat($('depAmt').value);
  if(!a||a<=0){toast('Enter valid amount','er');return}
  try{
    await db.ref('wallet/'+UID+'/balance').transaction(v=>(v||0)+a);
    await db.ref('wallet/'+UID+'/transactions').push({title:'Deposit',amount:a,type:'income',icon:'fa-plus-circle',color:'var(--ok)',timestamp:Date.now()});
    clMod({target:$('mOv')});
    toast('$'+a.toFixed(2)+' deposited!','su');
  }catch(e){toast('Failed','er')}
}
function openWdr(){
  $('mCtn').innerHTML=
    '<div class="mtl">Withdraw Funds</div>'+
    '<div class="fg"><label>Amount ($)</label>'+
    '<input class="fi" id="wdrAmt" type="number" min="1" step="0.01" placeholder="Enter amount">'+
    '</div>'+
    '<button class="bp" onclick="procWdr()" style="background:linear-gradient(135deg,var(--wn),#e68a00)">Withdraw Now</button>';
  opMod();
}
async function procWdr(){
  const a=parseFloat($('wdrAmt').value);
  if(!a||a<=0){toast('Enter valid amount','er');return}
  try{
    const s=await db.ref('wallet/'+UID+'/balance').once('value');
    if((s.val()||0)<a){toast('Insufficient balance','er');return}
    await db.ref('wallet/'+UID+'/balance').transaction(v=>Math.max(0,(v||0)-a));
    await db.ref('wallet/'+UID+'/transactions').push({title:'Withdrawal',amount:-a,type:'expense',icon:'fa-university',color:'var(--dn)',timestamp:Date.now()});
    clMod({target:$('mOv')});
    toast('$'+a.toFixed(2)+' withdrawal initiated','su');
  }catch(e){toast('Failed','er')}
}
initUser();
</script>
</body>
</html>
