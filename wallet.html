<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wallet.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <header class="top-bar">
        <div class="top-bar-left">
            <button class="icon-btn" id="back-btn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
        </div>
        <h1 class="app-title">Wallet</h1>
        <div class="top-bar-right"></div>
    </header>

    <main class="wallet-container">
        <!-- 余额卡片 -->
        <div class="wallet-card">
            <div class="wallet-card-bg"></div>
            <div class="wallet-card-content">
                <p class="wallet-label">Available Balance</p>
                <h2 class="wallet-balance" id="wallet-balance">$0.00</h2>
                <div class="wallet-stats">
                    <div class="wallet-stat">
                        <span class="wallet-stat-label">Total Earnings</span>
                        <span class="wallet-stat-value" id="total-earnings">$0.00</span>
                    </div>
                    <div class="wallet-stat-divider"></div>
                    <div class="wallet-stat">
                        <span class="wallet-stat-label">Withdrawn</span>
                        <span class="wallet-stat-value" id="total-withdrawn">$0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="wallet-actions">
            <button class="wallet-action-btn" id="btn-withdraw">
                <div class="wallet-action-icon" style="background:var(--accent);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </div>
                <span>Withdraw</span>
            </button>
            <button class="wallet-action-btn" id="btn-history">
                <div class="wallet-action-icon" style="background:#6C5CE7;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span>History</span>
            </button>
        </div>

        <!-- 提现弹窗 -->
        <div class="withdraw-modal" id="withdraw-modal">
            <div class="withdraw-modal-header">
                <h3>Withdraw Funds</h3>
                <button class="icon-btn" id="close-withdraw">✕</button>
            </div>
            <div class="withdraw-modal-body">
                <p class="withdraw-available">Available: <strong id="withdraw-available-amount">$0.00</strong></p>
                <div class="form-group">
                    <label for="withdraw-amount">Amount ($)</label>
                    <input type="number" id="withdraw-amount" class="input-field" placeholder="0.00" min="1" step="0.01">
                </div>
                <div class="form-group">
                    <label for="withdraw-method">Payment Method</label>
                    <select id="withdraw-method" class="input-field select-field">
                        <option value="paypal">PayPal</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="crypto">Cryptocurrency</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="withdraw-details">Payment Details</label>
                    <input type="text" id="withdraw-details" class="input-field" placeholder="Email, account number, or wallet address">
                </div>
                <button class="btn-primary btn-full" id="btn-submit-withdraw">Submit Withdrawal</button>
            </div>
        </div>
        <div class="withdraw-overlay" id="withdraw-overlay"></div>

        <!-- 交易记录 -->
        <div class="wallet-section">
            <h3 class="wallet-section-title">Recent Transactions</h3>
            <div class="transactions-list" id="transactions-list">
                <div class="empty-state" id="transactions-empty">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                    <p>No transactions yet</p>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>Upload</span>
        </a>
        <a href="wallet.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 10h20" stroke="white" stroke-width="2"/><circle cx="18" cy="15" r="1" fill="white"/></svg>
            <span>Wallet</span>
        </a>
        <a href="referral.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Refer</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>
