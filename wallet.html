<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* COPY EXACT CSS FROM home.html HERE TO KEEP RULES INTACT */
  :root { --bg: #0a0e14; --bg-secondary: #111820; --bg-card: #151d28; --bg-elevated: #1a2332; --fg: #e8edf3; --fg-muted: #6b7d94; --fg-dim: #3d4f63; --accent: #00d4aa; --accent-glow: rgba(0, 212, 170, 0.25); --accent-dark: #00a885; --danger: #ff4757; --warning: #ffa502; --success: #2ed573; --border: rgba(255,255,255,0.06); --glass: rgba(17, 24, 32, 0.85); --radius: 14px; --radius-sm: 8px; --radius-full: 9999px; --shadow: 0 8px 32px rgba(0,0,0,0.4); --shadow-accent: 0 4px 20px rgba(0, 212, 170, 0.3); --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); } * { margin: 0; padding: 0; box-sizing: border-box; } html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; } .app-shell { max-width: 430px; margin: 0 auto; height: 100vh; height: 100dvh; position: relative; overflow: hidden; background: var(--bg); } .bg-atmosphere { position: fixed; top: 0; left: 50%; transform: translateX(-50%); max-width: 430px; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; } .bg-atmosphere .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: orbFloat 12s ease-in-out infinite; } .bg-atmosphere .orb:nth-child(1) { width: 300px; height: 300px; background: var(--accent); top: -80px; right: -60px; animation-delay: 0s; } .bg-atmosphere .orb:nth-child(2) { width: 200px; height: 200px; background: #ff6b6b; bottom: 100px; left: -40px; animation-delay: -4s; opacity: 0.08; } .bg-atmosphere .orb:nth-child(3) { width: 250px; height: 250px; background: #ffd93d; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -8s; opacity: 0.05; } @keyframes orbFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -30px) scale(1.1); } 66% { transform: translate(-15px, 20px) scale(0.95); } } .page { position: absolute; top: 0; left: 0; right: 0; bottom: 64px; overflow-y: auto; overflow-x: hidden; z-index: 1; opacity: 0; transform: translateY(20px); pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; -webkit-overflow-scrolling: touch; scrollbar-width: none; } .page::-webkit-scrollbar { display: none; } .page.active { opacity: 1; transform: translateY(0); pointer-events: all; } .top-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); } .top-bar .logo { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; } .top-bar .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } } .top-bar .actions { display: flex; gap: 16px; } .top-bar .actions button { background: none; border: none; color: var(--fg); font-size: 20px; cursor: pointer; position: relative; transition: var(--transition); } .top-bar .actions button:hover { color: var(--accent); } .top-bar .actions .badge { position: absolute; top: -4px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--danger); color: #fff; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid var(--bg); } .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; z-index: 100; display: flex; align-items: center; justify-content: space-around; background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--border); } .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--fg-dim); font-size: 10px; font-family: 'Outfit', sans-serif; font-weight: 500; cursor: pointer; padding: 6px 14px; border-radius: var(--radius-sm); transition: var(--transition); position: relative; text-decoration: none; } .nav-item i { font-size: 20px; transition: var(--transition); } .nav-item.active { color: var(--accent); } .nav-item.active i { transform: scale(1.1); } .nav-item::before { content: ''; position: absolute; top: -1px; left: 50%; transform: translateX(-50%) scaleX(0); width: 24px; height: 2px; border-radius: 2px; background: var(--accent); transition: var(--transition); } .nav-item.active::before { transform: translateX(-50%) scaleX(1); } .nav-item.upload-btn { position: relative; top: -10px; } .nav-item.upload-btn .upload-icon-wrap { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-accent); transition: var(--transition); } .nav-item.upload-btn:hover .upload-icon-wrap { transform: scale(1.08); box-shadow: 0 6px 28px rgba(0, 212, 170, 0.45); } .nav-item.upload-btn i { color: #fff; font-size: 20px; } .nav-item.upload-btn span { display: none; } .wallet-hero { margin: 16px 18px; padding: 28px 22px; border-radius: var(--radius); background: linear-gradient(135deg, #0d2d24, #0a1f1a, #071510); border: 1px solid rgba(0, 212, 170, 0.15); position: relative; overflow: hidden; } .wallet-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--accent); opacity: 0.06; filter: blur(40px); } .wallet-hero .label { font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; } .wallet-hero .balance { font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; color: #fff; margin-bottom: 4px; } .wallet-hero .balance .currency { font-size: 22px; color: var(--accent); } .wallet-hero .change { font-size: 13px; color: var(--success); display: flex; align-items: center; gap: 4px; } .wallet-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 18px; margin-bottom: 24px; } .wallet-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: var(--transition); color: var(--fg); font-family: 'Outfit', sans-serif; } .wallet-action-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); } .wallet-action-btn .icon-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; } .wallet-action-btn span { font-size: 11px; font-weight: 500; color: var(--fg-muted); } .section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px; margin-bottom: 14px; } .section-header h3 { font-size: 16px; font-weight: 700; } .section-header .see-all { font-size: 13px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: 'Outfit', sans-serif; font-weight: 500; } .tx-list { padding: 0 18px; } .tx-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); transition: var(--transition); } .tx-item:last-child { border-bottom: none; } .tx-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; } .tx-info { flex: 1; } .tx-info .tx-title { font-size: 14px; font-weight: 600; } .tx-info .tx-date { font-size: 11px; color: var(--fg-dim); margin-top: 2px; } .tx-amount { font-size: 14px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; } .tx-amount.positive { color: var(--success); } .tx-amount.negative { color: var(--danger); } .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; max-width: 400px; width: calc(100% - 36px); } .toast { padding: 14px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; animation: toastIn 0.35s ease, toastOut 0.35s ease 2.5s forwards; box-shadow: var(--shadow); } .toast.success { background: #0d2818; border: 1px solid rgba(46, 213, 115, 0.3); color: var(--success); } .toast.error { background: #2d0f13; border: 1px solid rgba(255, 71, 87, 0.3); color: var(--danger); } .toast.info { background: #0d1f2d; border: 1px solid rgba(0, 212, 170, 0.3); color: var(--accent); } @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } } @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } } .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 500; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.show { opacity: 1; pointer-events: all; } .modal-sheet { max-width: 430px; width: 100%; background: var(--bg-secondary); border-radius: 20px 20px 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); max-height: 70vh; overflow-y: auto; } .modal-overlay.show .modal-sheet { transform: translateY(0); } .modal-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--fg-dim); margin: 0 auto 16px; } .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; } .modal-option { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); } .modal-option:hover { background: var(--bg-elevated); } .modal-option i { font-size: 20px; width: 28px; text-align: center; } .modal-option span { font-size: 14px; font-weight: 500; } .modal-option.danger { color: var(--danger); } .fade-up { opacity: 0; transform: translateY(16px); animation: fadeUp 0.5s ease forwards; } @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } } .fade-up:nth-child(2) { animation-delay: 0.05s; } .fade-up:nth-child(3) { animation-delay: 0.1s; } .fade-up:nth-child(4) { animation-delay: 0.15s; } .fade-up:nth-child(5) { animation-delay: 0.2s; } .auth-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; z-index: 200; } .auth-screen .logo-auth { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; } .auth-screen .logo-auth .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent); } .auth-screen input { width: 100%; max-width: 300px; padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg); font-size: 15px; font-family: 'Outfit', sans-serif; outline: none; margin-bottom: 16px; transition: var(--transition); } .auth-screen input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); } .auth-screen button { width: 100%; max-width: 300px; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #000; font-size: 15px; font-weight: 700; font-family: 'Outfit', sans-serif; border: none; border-radius: var(--radius); cursor: pointer; transition: var(--transition); } .auth-screen button:hover { box-shadow: var(--shadow-accent); transform: translateY(-1px); } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } } @media (min-width: 431px) { .app-shell { border-left: 1px solid var(--border); border-right: 1px solid var(--border); } }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="bg-atmosphere"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  
  <div class="auth-screen" id="authScreen">
    <div class="logo-auth"><div class="dot"></div>InstaGram</div>
    <input type="text" id="regName" placeholder="Enter your name to continue">
    <button onclick="registerBrowserUser()">Join InstaGram</button>
  </div>

  <div class="page active" id="page-wallet" style="display:none">
    <div class="top-bar">
      <div class="logo">Wallet</div>
      <div class="actions"><button aria-label="History" id="historyBtn"><i class="fas fa-history"></i></button></div>
    </div>
    <div class="wallet-hero fade-up">
      <div class="label">Total Balance</div>
      <div class="balance"><span class="currency">$</span><span id="walletBalance">0.00</span></div>
      <div class="change" id="walletChange" style="display:none"><i class="fas fa-arrow-up"></i> <span id="walletChangeText"></span></div>
    </div>
    <div class="wallet-actions fade-up">
      <button class="wallet-action-btn" onclick="handleWalletAction('deposit')">
        <div class="icon-circle" style="background:rgba(0,212,170,0.15);color:var(--accent)"><i class="fas fa-plus"></i></div>
        <span>Deposit</span>
      </button>
      <button class="wallet-action-btn" onclick="handleWalletAction('withdraw')">
        <div class="icon-circle" style="background:rgba(255,165,2,0.15);color:var(--warning)"><i class="fas fa-arrow-up"></i></div>
        <span>Withdraw</span>
      </button>
      <button class="wallet-action-btn" onclick="handleWalletAction('transfer')">
        <div class="icon-circle" style="background:rgba(116,125,255,0.15);color:#747dff"><i class="fas fa-exchange-alt"></i></div>
        <span>Transfer</span>
      </button>
      <button class="wallet-action-btn" onclick="showToast('QR Code generated', 'success')">
        <div class="icon-circle" style="background:rgba(255,107,107,0.15);color:#ff6b6b"><i class="fas fa-qrcode"></i></div>
        <span>QR Pay</span>
      </button>
    </div>
    <div class="section-header fade-up"><h3>Recent Transactions</h3></div>
    <div class="tx-list fade-up" id="txList"></div>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation" style="display:none">
    <a href="home.html" class="nav-item" aria-label="Home"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="wallet.html" class="nav-item active" aria-label="Wallet"><i class="fas fa-wallet"></i><span>Wallet</span></a>
    <a href="upload.html" class="nav-item upload-btn" aria-label="Upload"><div class="upload-icon-wrap"><i class="fas fa-plus"></i></div><span>Upload</span></a>
    <a href="referral.html" class="nav-item" aria-label="Referral"><i class="fas fa-gift"></i><span>Invite</span></a>
    <a href="profile.html" class="nav-item" aria-label="Profile"><i class="fas fa-user"></i><span>Profile</span></a>
  </nav>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)"><div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()"><div class="modal-handle"></div><div id="modalContent"></div></div></div>
  <div class="toast-container" id="toastContainer"></div>
</div>

<script src="app.js"></script>
<script>
function setupPage() {
  document.getElementById('page-wallet').style.display = 'block';
  document.querySelector('.bottom-nav').style.display = 'flex';
  fetchWalletData(renderWallet);
}

function renderWallet(data) {
  document.getElementById('walletBalance').textContent = data.balance.toFixed(2);
  const txList = document.getElementById('txList');
  txList.innerHTML = '';
  const txs = Object.values(data.transactions).sort((a, b) => b.createdAt - a.createdAt);
  if (txs.length === 0) {
    txList.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--fg-dim)">No transactions yet.</div>';
    return;
  }
  txs.forEach(tx => {
    const isPos = tx.type === 'deposit' || tx.type === 'reward';
    const icons = { deposit: 'fa-arrow-down', withdraw: 'fa-arrow-up', transfer: 'fa-exchange-alt', reward: 'fa-gift' };
    const colors = { deposit: 'rgba(0,212,170,0.15);color:var(--accent)', withdraw: 'rgba(255,165,2,0.15);color:var(--warning)', transfer: 'rgba(116,125,255,0.15);color:#747dff', reward: 'rgba(255,107,107,0.15);color:#ff6b6b' };
    txList.innerHTML += `
      <div class="tx-item">
        <div class="tx-icon" style="background:${colors[tx.type] || colors.deposit}"><i class="fas ${icons[tx.type] || 'fa-circle'}"></i></div>
        <div class="tx-info">
          <div class="tx-title">${tx.description}</div>
          <div class="tx-date">${timeAgo(tx.createdAt)}</div>
        </div>
        <div class="tx-amount ${isPos ? 'positive' : 'negative'}">${isPos ? '+' : '-'}$${tx.amount.toFixed(2)}</div>
      </div>`;
  });
}

function handleWalletAction(type) {
  const amount = parseFloat(prompt("Enter amount in USD:"));
  if (isNaN(amount) || amount <= 0) return;
  updateWalletTransaction(type, amount, type.charAt(0).toUpperCase() + type.slice(1));
}
</script>
</body>
</html>
