
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <header class="top-bar">
        <div class="top-bar-left">
            <button class="icon-btn" id="back-btn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
        </div>
        <h1 class="app-title" id="profile-title">Profile</h1>
        <div class="top-bar-right">
            <button class="icon-btn" id="settings-btn" aria-label="Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </header>

    <main class="profile-container">
        <!-- 封面和头像 -->
        <div class="profile-cover-wrapper">
            <div class="profile-cover" id="profile-cover">
                <div class="cover-gradient"></div>
            </div>
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar" id="profile-avatar">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="verified-badge" id="verified-badge" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="#3897F0"><path d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                </div>
            </div>
        </div>

        <!-- 用户信息 -->
        <div class="profile-info">
            <div class="profile-name-row">
                <h2 class="profile-username" id="profile-username">Loading...</h2>
                <button class="btn-primary btn-sm" id="btn-edit-profile">Edit Profile</button>
                <button class="icon-btn" id="btn-share-profile" aria-label="Share profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </button>
            </div>
            <p class="profile-bio" id="profile-bio"></p>
            <div class="profile-quick-links">
                <a href="wallet.html" class="profile-quick-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="18" cy="15" r="1"/></svg>
                    Wallet
                </a>
                <a href="referral.html" class="profile-quick-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    Refer & Earn
                </a>
                <button class="profile-quick-link" id="btn-qr-code">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    QR Code
                </button>
            </div>
        </div>

        <!-- 统计数据 -->
        <div class="profile-stats">
            <div class="profile-stat-item">
                <span class="profile-stat-number" id="profile-posts-count">0</span>
                <span class="profile-stat-label">Posts</span>
            </div>
            <div class="profile-stat-item">
                <span class="profile-stat-number" id="profile-followers-count">0</span>
                <span class="profile-stat-label">Followers</span>
            </div>
            <div class="profile-stat-item">
                <span class="profile-stat-number" id="profile-following-count">0</span>
                <span class="profile-stat-label">Following</span>
            </div>
        </div>

        <!-- 帖子标签切换 -->
        <div class="profile-tabs">
            <button class="profile-tab active" data-tab="posts">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="profile-tab" data-tab="reels">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            </button>
            <button class="profile-tab" data-tab="saved">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
        </div>

        <!-- 帖子网格 -->
        <div class="profile-grid" id="profile-grid">
            <div class="empty-state" id="profile-posts-empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <h3>No Posts Yet</h3>
                <p>When you share posts, they will appear here.</p>
                <a href="upload.html" class="btn-primary btn-sm">Share Your First Post</a>
            </div>
        </div>
    </main>

    <!-- 编辑资料弹窗 -->
    <div class="edit-modal" id="edit-modal">
        <div class="edit-modal-header">
            <h3>Edit Profile</h3>
            <button class="icon-btn" id="close-edit">✕</button>
        </div>
        <div class="edit-modal-body">
            <div class="edit-avatar-section">
                <div class="edit-avatar-preview" id="edit-avatar-preview">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <button class="btn-secondary btn-sm" id="btn-change-avatar">Change Photo</button>
                <input type="file" id="avatar-input" accept="image/*" hidden>
            </div>
            <div class="form-group">
                <label for="edit-username">Username</label>
                <input type="text" id="edit-username" class="input-field" maxlength="30">
            </div>
            <div class="form-group">
                <label for="edit-displayname">Display Name</label>
                <input type="text" id="edit-displayname" class="input-field" maxlength="50">
            </div>
            <div class="form-group">
                <label for="edit-bio">Bio</label>
                <textarea id="edit-bio" class="input-field textarea-field" maxlength="150" rows="3"></textarea>
                <span class="char-count" id="bio-count">0 / 150</span>
            </div>
            <button class="btn-primary btn-full" id="btn-save-profile">Save Changes</button>
        </div>
    </div>
    <div class="edit-overlay" id="edit-overlay"></div>

    <!-- QR码弹窗 -->
    <div class="qr-modal" id="qr-modal">
        <div class="qr-modal-header">
            <h3>QR Code</h3>
            <button class="icon-btn" id="close-qr">✕</button>
        </div>
        <div class="qr-modal-body">
            <div class="qr-code-display" id="qr-code-display">
                <canvas id="qr-canvas"></canvas>
            </div>
            <p class="qr-username" id="qr-username">@username</p>
            <button class="btn-secondary" id="btn-download-qr">Download QR Code</button>
        </div>
    </div>
    <div class="qr-overlay" id="qr-overlay"></div>

    <div class="toast-container" id="toast-container"></div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>Upload</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="18" cy="15" r="1"/></svg>
            <span>Wallet</span>
        </a>
        <a href="referral.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Refer</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="white" stroke-width="2"/><circle cx="12" cy="7" r="4" fill="none" stroke="white" stroke-width="2"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
