<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Referral - InstaGram</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--bg2:#111820;--bgc:#151d28;--bge:#1a2332;--fg:#e8edf3;--fm:#6b7d94;--fd:#3d4f63;--ac:#00d4aa;--dn:#ff4757;--ok:#2ed573;--bd:rgba(255,255,255,.06);--gl:rgba(17,24,32,.88);--r:14px;--rs:8px;--rf:9999px;--t:.3s cubic-bezier(.4,0,.2,1)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.atm{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.atm .o{position:absolute;border-radius:50%;filter:blur(80px);animation:of 12s ease-in-out infinite}
.atm .o:nth-child(1){width:200px;height:200px;background:#ff6b6b;top:-50px;right:-30px;opacity:.05;animation-delay:-4s}
@keyframes of{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-15px,20px) scale(.95)}}
.pg{position:absolute;top:0;left:0;right:0;bottom:60px;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.tb{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd)}
.lg{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;display:flex;align-items:center;gap:7px}
.ta button{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;transition:var(--t)}
.ta button:hover{color:var(--ac)}
.bn{position:absolute;bottom:0;left:0;right:0;height:60px;z-index:100;display:flex;align-items:center;justify-content:space-around;background:var(--gl);backdrop-filter:blur(24px);border-top:1px solid var(--bd)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--fd);font-size:9px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;padding:4px 12px;border-radius:var(--rs);transition:var(--t);position:relative;text-decoration:none}
.ni i{font-size:19px;transition:var(--t)}
.ni.on{color:var(--ac)}.ni.on i{transform:scale(1.1)}
.ni::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%) scaleX(0);width:22px;height:2px;border-radius:2px;background:var(--ac);transition:var(--t)}
.ni.on::before{transform:translateX(-50%) scaleX(1)}
.ni.ub{position:relative;top:-8px}
.ni.ub .uw{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#00a885);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,212,170,.3);transition:var(--t)}
.ni.ub i{color:#fff;font-size:18px}.ni.ub span{display:none}
.ni.on{color:var(--ac)}
.ni::before{transform:translateX(-50%) scaleX(1)}
.ni.on::before{transform:translateX(-50%) scaleX(1)}
.tc{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;max-width:390px;width:calc(100% - 32px)}
.to{padding:12px 16px;border-radius:var(--rs);font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:6px;animation:ti .3s ease,to2 .3s ease 2.5s forwards;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.to.su{background:#0d2818;border:1px solid rgba(46,213,115,.3);color:var(--ok)}
.to.er{background:#2d0f13;border:1px solid rgba(255,71,87,.3);color:var(--dn)}
.to.in{background:#0d1f2d;border:1px solid rgba(0,212,170,.3);color:var(--ac)}
@keyframes ti{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes to2{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
@media(min-width:431px){.app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</style>
</head>
<body>
<div class="app">
<div class="atm"><div class="o"></div></div></div>
<div class="pg">
<div class="tb">
  <div class="lg">Invite & Earn</div>
  <div class="ta"><button onclick="shareRef()"><i class="fas fa-share-alt"></i></button></div>
</div>
<div class="rh">
  <div class="gi">&#127873;</div>
  <h2>Earn While You Share</h2>
  <p>Invite friends and earn commission for each referral who joins using your code.</p>
  <div class="ca" id="commDsp">Loading...</div>
  <div style="font-size:10px;color:var(--fd);margin-top:2px">Commission per referral</div>
</div>
<div class="cb">
  <div class="cd" id="myCode">Loading...</div>
  <button class="cp" id="cpBtn" onclick="cpCode()">Copy</button>
</div>
<div class="as2">
    <h4><i class="fas fa-ticket-alt" style="color:var(--ac);margin-right:5px"></i>Have a referral code?</h4>
    <div class="ar">
      <input type="text" id="apInp" placeholder="ENTER CODE" maxlength="12px">
      <button id="apBtn" onclick="apCode()">Apply</button>
    </div>
  </div>
  <div class="rst">
    <div class="rsc"><div class="rn" id="stInv">0</div><div class="rl">Invited</div></div>
    <div class="rsc"><div class="rn" id="stAct">0</div><div class="rl">Active</div></div>
    <div class="rsc"><div class="rn" id="stEar">$0</div><div class="rl">Earned</div></div>
  </div>
  <div style="padding:0 16px;margin-bottom:14px"><h3 style="font-size:15px;font-weight:700">Referral History</h3></div>
  <div class="rl2" id="refList"><div class="es"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div></div>
  <div style="height:20px"></div>
</div>
</div>
<nav class="bn" role="navigation">
<a class="ni" href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
<a class="ni" href="wallet.html"><i class="fas fa-wallet"></i><span>Wallet</span></a>
<a class="ni ub" href="upload.html"><div class="uw"><i class="fas fa-plus"></i></div><span>Upload</span></a>
<a class="ni on" href="referral.html"><i class="fas fa-gift"></i><span>Invite</span></a>
<a class="ni" href="profile.html"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>
<div class="tc" id="tCtn"></div>
</div>
<div class="tc" id="tCtn"></div>
</div>
<script>
firebase.initializeApp({apiKey:"AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",authDomain:"aibmodel.firebaseapp.com",databaseURL:"https://aibmodel-default-rtdb.firebaseio.com",projectId:"aibmodel",storageBucket:"aibmodel.firebasestorage.app",messagingSenderId:"572663832515",appId:"1:572663832515:web:3fea2dac685b9b5f646776"});
const db=firebase.database(),$=id=>document.getElementById(id);
function toast(m,t='in'){const c=$('tCtn'),e=document.createElement('div');e.className='to '+t;e.innerHTML='<i class="fas fa-info-circle"></i> '+m;c.appendChild(e);setTimeout(()=>e.remove(),3000)}
function opMod(){$('mOv').classList.add('sh')}
function clMod(e){if(e&&e.target!==$('mOv'))return;$('mOv').classList.remove('sh')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')clMod({target:$('mOv')})});
function animN(id,tgt,pfx=''){const el=$(id);if(!el)return;let c=0;const s=Math.max(1,Math.ceil(tgt/25));const iv=setInterval(()=>{c+=s;if(c>=tgt){c=tgt;clearInterval(iv)}el.textContent=pfx+c},35)}
function timeAgo(ts){if(!ts)return'';const d=Date.now()-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);if(m<1)return'now';if(m<60)return m+'m';if(h<24)return h+'h';if(dy<7)return dy+'d';return new Date(ts).toLocaleDateString()}

let UID='',CU={username:'',displayName:'',avatar:''};
function initUser(){
  let sid=null;try{sid=localStorage.getItem('igram_uid')}catch(e){}
  if(sid){UID=sid;db.ref('users/'+UID).once('value').then(s=>{if(s.exists())loadRef();else createNew()}).catch(()=>createNew())}else createNew()
}
function createNew(){
  UID='u_'+Date.now()+'_'+Math.random().toString(36).substr(2,9);
  const un='user_'+Math.random().toString(36).substr(2,6);CU={username:un,displayName:'New User',avatar:''};
  db.ref('users/'+UID).set({username:un,displayName:'New User',avatar:'',createdAt:Date.now(),lastSeen:Date.now()});
  db.ref('stats/totalUsers').transaction(v=>(v||0)+1);
  db.ref('wallet/'+UID+'/balance').set(15);
  db.ref('wallet/'+UID+'/transactions').push({title:'Welcome Bonus',amount:15,type:'income',icon:'fa-gift',color:'var(--ok)',timestamp:Date.now()});
  try{localStorage.setItem('igram_uid',UID)}catch(e){}
  loadRef();
}
function loadRef(){
  db.ref('admin/referralCommission').once('value').then(s=>{commAmt=s.val()||10;$('commDsp').textContent='$'+commAmt.toFixed(2)});
  db.ref('referrals/codes/'+UID).once('value').then(snap=>{
    const d=snap.val();
    if(d&&d.code){myRC=d.code}else{myRC=genCode();db.ref('referrals/codes/'+UID).set({code:myRC,createdAt:Date.now(),userId:UID})}
    $('myCode').textContent=myRC;loadMyRef();
  }).catch(()=>{myRC='GRAM-TEST';$('myCode').textContent=myRC}
}
function genCode(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let r='GRAM-';for(let i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
function loadMyRef(){
  db.ref('referrals/users/'+UID+'/referred').on('value',snap=>{
    const d=snap.val();
    if(!d){$('refList').innerHTML='<div class="es"><i class="fas fa-user-friends"></i><p>No referrals yet. Share your code!</p></div>';animN('stInv',0);animN('stAct',0);animN('stEar',0,'$');return}
    const l=Object.values(d),inv=l.length,act=l.filter(r=>r.status==='active').length,ear=l.filter(r=>r.status==='active').reduce((s,r)=>s+(r.commission||commAmt),0);
    animN('stInv',inv);animN('stAct',act);animN('stEar',Math.round(ear),'$');
    l.sort((a,b)=>(b.joinedAt||0)-(a.joinedAt||0));
    $('refList').innerHTML=l.map(r=>{
      const dt=r.joinedAt?timeAgo(r.joinedAt):'Unknown';
      const sc=r.status==='active'?'ac':'pn';st=r.status==='active'?'Active':'Pending';
      return '<div class="ri2"><div style="width:38px;height:38px;border-radius:50%;background:var(--bge);display:flex;align-items:center;justify-content:center;color:var(--fm);font-size:13px;font-weight:700;flex-shrink:0">'+(r.username||'?').charAt(0).toUpperCase()+'</div><div class="rif"><div class="rid"><div class="rin">'+(r.username||'Unknown')+'</div><div class="rid">'+dt">'+dt+' <span class="st '+sc+'">'+st+'</span></div></div><div class="rie">+$'+(r.commission||commAmt).toFixed(2)+'</div></div>';
    }).join('');
  });
}
function cpCode(){navigator.clipboard.writeText(myRC).then(()=>{const b=$('cpBtn');b.textContent='Copied!';b.classList.add('cp2');setTimeout(()=>{b.textContent='Copy';b.classList.remove('cp2')},2000);toast('Code copied!','su')}).catch(()=>toast('Code: '+myRC,'in'))}
function shareRef(){if(navigator.share)navigator.share({title:'Join InstaGram',text:'Use my code '+myRC+' to sign up!'});else cpCode()}
function apCode(){
  const code=$('apInp').value.trim().toUpperCase();
  if(!code){toast('Enter a code','er');return}
  if(code===myRC){toast('Cannot use own code','er');return}
  const btn=$('apBtn');btn.disabled=true;btn.textContent='Applying...';
  db.ref('referrals/codes').orderByChild('code').equalTo(code).once('value').then(snap=>{
    if(!snap.exists()){btn.disabled=false;btn.textContent='Apply';toast('Invalid code','er');return}
    let rid=null;snap.forEach(c=>{rid=c.key});
    db.ref('referrals/users/'+UID+'/appliedCode').once('value').then(aSnap=>{
      if(aSnap.val()){btn.disabled=false;btn.textContent='Already applied';toast('Already applied','er');return}
      db.ref('referrals/users/'+UID).update({appliedCode:code,referredBy:rid,appliedAt:Date.now(),status:'active'}).then(()=>{
        db.ref('referrals/users/'+rid+'/referred').push({userId:UID,username:CU.username,avatar:CU.avatar||'',status:'active',commission:commAmt,joinedAt:Date.now()});
        db.ref('wallet/'+UID+'/balance').transaction(v=>(v||0)+commAmt);
        db.ref('wallet/'+UID+'/transactions').push({title:'Referral Bonus',amount:commAmt,type:'income',icon:'fa-gift',color:'var(--ok)',timestamp:Date.now()});
        btn.disabled=false;btn.textContent='Applied';btn.style.background='var(--ok)';
        toast('Applied! +$'+commAmt.toFixed(2),'su');
      });
    });
  }).catch(e){btn.disabled=false;btn.textContent='Apply';toast('Error','er')}
}
initUser();
</script>
</script>
</body>
</html>
