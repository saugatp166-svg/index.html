<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <!-- 顶部导航 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <svg class="camera-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
        </div>
        <h1 class="app-title">Socialite</h1>
        <div class="top-bar-right">
            <button class="icon-btn" id="notif-btn" aria-label="Notifications">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
            </button>
            <button class="icon-btn" id="dm-btn" aria-label="Messages">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- 故事条 -->
    <div class="stories-bar" id="stories-bar">
        <div class="stories-scroll">
            <div class="story-item your-story" id="your-story-btn">
                <div class="story-ring">
                    <div class="story-avatar" id="your-story-avatar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </div>
                </div>
                <span class="story-name">Your story</span>
            </div>
        </div>
    </div>

    <!-- 帖子信息流 -->
    <main class="feed-container" id="feed-container">
        <div class="feed-loading" id="feed-loading">
            <div class="feed-loading-spinner"></div>
            <p>Loading feed...</p>
        </div>
        <div class="feed-empty" id="feed-empty" style="display:none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            <h3>No Posts Yet</h3>
            <p>Be the first to share something amazing.</p>
            <a href="upload.html" class="btn-primary">Create Post</a>
        </div>
    </main>

    <!-- 通知面板 -->
    <div class="notif-panel" id="notif-panel">
        <div class="notif-panel-header">
            <h3>Notifications</h3>
            <button class="icon-btn" id="close-notif">✕</button>
        </div>
        <div class="notif-panel-body" id="notif-panel-body">
            <p class="notif-empty-text">No notifications yet</p>
        </div>
    </div>
    <div class="notif-overlay" id="notif-overlay"></div>

    <!-- 评论弹窗 -->
    <div class="comments-modal" id="comments-modal">
        <div class="comments-modal-header">
            <h3>Comments</h3>
            <button class="icon-btn" id="close-comments">✕</button>
        </div>
        <div class="comments-list" id="comments-list"></div>
        <div class="comments-input-area">
            <div class="comments-user-avatar" id="comment-user-avatar"></div>
            <input type="text" id="comment-input" placeholder="Add a comment..." maxlength="500">
            <button class="btn-post-comment" id="btn-post-comment">Post</button>
        </div>
    </div>
    <div class="comments-overlay" id="comments-overlay"></div>

    <!-- 分享弹窗 -->
    <div class="share-modal" id="share-modal">
        <div class="share-modal-header">
            <h3>Share</h3>
            <button class="icon-btn" id="close-share">✕</button>
        </div>
        <div class="share-options">
            <button class="share-option" data-type="copy">
                <div class="share-option-icon" style="background:var(--accent);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div>
                <span>Copy Link</span>
            </button>
            <button class="share-option" data-type="whatsapp">
                <div class="share-option-icon" style="background:#25D366;"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg></div>
                <span>WhatsApp</span>
            </button>
            <button class="share-option" data-type="telegram">
                <div class="share-option-icon" style="background:#0088CC;"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></div>
                <span>Telegram</span>
            </button>
            <button class="share-option" data-type="twitter">
                <div class="share-option-icon" style="background:#000;"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
                <span>X (Twitter)</span>
            </button>
        </div>
    </div>
    <div class="share-overlay" id="share-overlay"></div>

    <!-- 举报弹窗 -->
    <div class="report-modal" id="report-modal">
        <div class="report-modal-header">
            <h3>Report</h3>
            <button class="icon-btn" id="close-report">✕</button>
        </div>
        <div class="report-options">
            <button class="report-option" data-reason="spam">Spam</button>
            <button class="report-option" data-reason="nudity">Nudity or sexual content</button>
            <button class="report-option" data-reason="violence">Violence or harmful content</button>
            <button class="report-option" data-reason="harassment">Harassment or bullying</button>
            <button class="report-option" data-reason="hate">Hate speech</button>
            <button class="report-option" data-reason="copyright">Copyright violation</button>
            <button class="report-option" data-reason="other">Other</button>
        </div>
    </div>
    <div class="report-overlay" id="report-overlay"></div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.35 7.5 12 10.82 4.65 7.5 12 4.18zM4 9.04l7 3.5V19.5l-7-3.5V9.04zm9 10.46v-6.96l7-3.5V16l-7 3.5z"/></svg>
            <span>Home</span>
        </a>
        <a href="upload.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>Upload</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="18" cy="15" r="1"/></svg>
            <span>Wallet</span>
        </a>
        <a href="referral.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Refer</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/database.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
